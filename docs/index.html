<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OnBrand Ad Creative Kit — how one run becomes 150 creatives</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF;
  --ink:#18181B;
  --ink2:#71717A;
  --line:#D4D4D8;
  --accent:#BE185D;
  --frame:#EDEEF0;
  --bar:#9CA3AF;
  --mini:#DFE2E7;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);overflow:hidden}
body{font-family:"Inter",ui-sans-serif,-apple-system,"Helvetica Neue",Arial,sans-serif;
     color:var(--ink);font-weight:500;-webkit-font-smoothing:antialiased}

#wrap{position:fixed;inset:0;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;
       transform-origin:center center;transform:translate(-50%,-50%);background:var(--bg)}
svg.d{position:absolute;inset:0;width:1600px;height:900px;overflow:visible}

.st{fill:var(--ink);font-size:44px;font-weight:400;letter-spacing:-.02em;opacity:0;
    transition:opacity .7s ease}
.st.on{opacity:1}

/* input cards */
.card{opacity:0;transition:opacity .55s ease,transform .55s cubic-bezier(.2,0,.2,1);
      transform:translateX(-16px)}
.card.on{opacity:1;transform:none}
.card rect.box{fill:var(--bg);stroke:var(--line);stroke-width:1.5px}
.card .ct{fill:var(--ink);font-size:16px;font-weight:700;letter-spacing:.05em}
.card .cf{fill:var(--accent);font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;
          font-size:13.5px;font-weight:500}
.card .cl{fill:var(--ink);font-size:14.5px;font-weight:400}

/* wires + packets */
.w{fill:none;stroke:var(--ink2);stroke-width:1.5px;opacity:0;
   transition:opacity .35s ease,stroke-dashoffset .8s cubic-bezier(.4,0,.2,1)}
.w.on{opacity:.8;stroke-dashoffset:0 !important}
.w.fan.on{opacity:.55}
.pkt{fill:var(--ink);filter:drop-shadow(0 1px 4px rgba(24,24,27,.3))}
.pkt.a{fill:var(--accent)}

/* codex mark */
.mark{opacity:0;transform-box:fill-box;transform-origin:center;transform:scale(.86);
      transition:opacity .6s ease,transform .6s cubic-bezier(.2,0,.2,1)}
.mark.on{opacity:1;transform:none}
.mark.beat{animation:beat 2.6s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.halo{fill:none;stroke:#818CF8;stroke-width:1.5px;opacity:0}
.halo.go{animation:halo 2.6s ease-out infinite}
@keyframes halo{0%{opacity:.5;transform:scale(.82)}100%{opacity:0;transform:scale(1.25)}}

/* skill box */
.skill{opacity:0;transition:opacity .55s ease}
.skill.on{opacity:1}
.skill rect{fill:var(--bg);stroke:var(--accent);stroke-width:1.5px;stroke-dasharray:6 5}
.skill .sf{fill:var(--accent);font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;
           font-size:15px;font-weight:500}
.skill .sl{fill:var(--ink2);font-size:13.5px;font-weight:400}

/* output */
.rl{fill:var(--ink);font-size:16px;font-weight:700;letter-spacing:.05em;opacity:0;transition:opacity .5s ease}
.rl.on{opacity:1}
.rm{fill:var(--ink2);font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-size:13.5px;
    opacity:0;transition:opacity .5s ease}
.rm.on{opacity:1}
.hl{fill:var(--ink2);font-size:14px;font-weight:400;opacity:0;transition:opacity .5s ease}
.hl.on{opacity:1}
.mc{fill:var(--ink2);font-size:14px;font-weight:500;opacity:0;transition:opacity .5s ease}
.mc.on{opacity:1}

.frame{fill:var(--frame);stroke:#E4E4E7;stroke-width:1px;opacity:0;transition:opacity .4s ease}
.frame.on{opacity:1}
.bar{fill:var(--bar);opacity:0;transition:opacity .35s ease}
.bar.on{opacity:1}
.cta{fill:var(--accent);opacity:0;transition:opacity .35s ease}
.cta.on{opacity:1}

.mini{fill:var(--mini);opacity:0;transition:opacity .22s ease}
.mini.on{opacity:1}
.mbar{fill:#FFFFFF;opacity:0;transition:opacity .22s ease}
.mbar.on{opacity:.85}

/* counter */
.big{fill:var(--ink);font-size:52px;font-weight:700;letter-spacing:-.03em;opacity:0;
     transition:opacity .4s ease}
.big.on{opacity:1}
.bigl{fill:var(--ink2);font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
      opacity:0;transition:opacity .4s ease}
.bigl.on{opacity:1}

/* footer */
.note{fill:var(--ink);font-size:14.5px;font-weight:400;opacity:0;transition:opacity .6s ease}
.note.on{opacity:1}
.rule{stroke:var(--line);stroke-width:1px;opacity:0;transition:opacity .6s ease}
.rule.on{opacity:.9}
.fx{fill:var(--ink);font-size:18px;font-weight:400;opacity:0;transition:opacity .5s ease}
.fx.on{opacity:1}
.fx tspan.k{fill:var(--accent);font-weight:700}
.fx tspan.b{font-weight:700}
.repo{fill:var(--ink2);font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-size:12.5px;opacity:0;transition:opacity .5s ease}
.repo.on{opacity:.8}

#chrome{position:fixed;left:0;right:0;bottom:0;padding:15px 26px 17px;display:flex;gap:20px;
  align-items:center;font-size:11.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink2);background:linear-gradient(to top,rgba(255,255,255,.95),rgba(255,255,255,0));
  transition:opacity .3s}
#chrome.hide{opacity:0;pointer-events:none}
#keys{margin-left:auto;opacity:.75;font-weight:500;letter-spacing:.05em;text-transform:none;font-size:12px}
#bar{position:fixed;left:0;top:0;height:2px;background:var(--ink);width:0;opacity:.45;transition:width .12s linear}
</style>
</head>

<script>
(() => {
  'use strict';
  const stage = document.getElementById('stage');
  const fit = () => {
    const s = Math.min(innerWidth / 1600, innerHeight / 900);
    stage.style.transform = `translate(-50%,-50%) scale(${s})`;
  };
  addEventListener('resize', fit); fit();

  const NS = 'http://www.w3.org/2000/svg';
  const mk = (t, a) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); return e; };
  const svg = document.querySelector('svg.d');
  const rowsG = document.querySelector('.rows');

  /* ---------- output rows ---------- */
  const ROWS = [
    { k: 'r1', name: 'SQUARE',   meta: '1 : 1 · 1080×1080 · 50 creatives',
      ly: 186, ty: 206, w: 120, h: 120, gap: 136,
      sx: 1240, sy: 236, mw: 12, mh: 12, gx: 15, gy: 15, cy: 330 },
    { k: 'r2', name: 'PORTRAIT', meta: '4 : 5 · 1080×1350 · 50 creatives',
      ly: 396, ty: 416, w: 112, h: 140, gap: 128,
      sx: 1200, sy: 458, mw: 11, mh: 14, gx: 14, gy: 17, cy: 548 },
    { k: 'r3', name: 'STORY',    meta: '9 : 16 · 1080×1920 · 50 creatives',
      ly: 606, ty: 626, w: 96,  h: 170, gap: 112,
      sx: 1160, sy: 672, mw: 9,  mh: 16, gx: 12, gy: 19, cy: 770 }
  ];

  // one wireframe ad: grey canvas, two heading bars, a CTA chip
  const thumb = (cls, x, y, w, h, v) => {
    rowsG.appendChild(mk('rect', { class: 'frame ' + cls, x, y, width: w, height: h, rx: 2 }));
    rowsG.appendChild(mk('rect', { class: 'bar ' + cls, x: x + w * .13, y: y + h * .46,
      width: w * (v ? .62 : .70), height: Math.max(6, Math.round(h * .055)), rx: 1 }));
    rowsG.appendChild(mk('rect', { class: 'bar ' + cls, x: x + w * (v ? .19 : .21), y: y + h * .59,
      width: w * (v ? .58 : .50), height: Math.max(5, Math.round(h * .045)), rx: 1 }));
    rowsG.appendChild(mk('rect', { class: 'cta ' + cls, x: x + w * .10, y: y + h * .77,
      width: w * .23, height: Math.max(8, Math.round(h * .075)), rx: 1.5 }));
  };
  const label = (cls, x, y, s, kind, anchor) => {
    const t = mk('text', { class: kind + ' ' + cls, x, y });
    if (anchor) t.setAttribute('text-anchor', anchor);
    t.textContent = s; rowsG.appendChild(t);
  };

  ROWS.forEach(r => {
    label(r.k, 884, r.ly, r.name, 'rl');
    label(r.k, 1076, r.ly, r.meta, 'rm');
    thumb(r.k + ' h1', 884, r.ty, r.w, r.h, 0);
    thumb(r.k + ' h2', 884 + r.gap, r.ty, r.w, r.h, 1);
    label(r.k, 884, r.ty + r.h + 22, 'H1', 'hl');
    label(r.k, 884 + r.gap, r.ty + r.h + 22, 'H2', 'hl');
    // the other 48 — a contact sheet, so the scale is something you can see
    for (let i = 0; i < 48; i++) {
      const c = i % 12, rr = (i / 12) | 0;
      const x = r.sx + c * r.gx, y = r.sy + rr * r.gy;
      rowsG.appendChild(mk('rect', { class: 'mini ' + r.k + ' m' + i, x, y, width: r.mw, height: r.mh, rx: 1 }));
      rowsG.appendChild(mk('rect', { class: 'mbar ' + r.k + ' m' + i,
        x: x + r.mw * .18, y: y + r.mh * .45, width: r.mw * .64, height: 1.6, rx: .8 }));
    }
    label(r.k, r.sx, r.cy, '+ 48 more, same lockup', 'mc');
  });

  document.querySelectorAll('path.w').forEach(p => {
    const L = p.getTotalLength() || 1;
    p.style.strokeDasharray = L; p.style.strokeDashoffset = L;
  });

  /* ---------- engine ---------- */
  const DUR = 19500;
  const clock = { t: 0, paused: false };
  let beats = [], packets = [], applied = [];
  const at = (ms, fn) => beats.push({ ms, fn, done: false });
  const on = (sel, cls = 'on') => document.querySelectorAll(sel).forEach(el => {
    el.classList.add(cls); applied.push([el, cls]);
  });
  const pkt = (sel, o = {}) => {
    const { dur = 1000, n = 1, gap = 200, r = 4.5, cls = '', delay = 0 } = o;
    document.querySelectorAll(sel).forEach(path => {
      const L = path.getTotalLength() || 1;
      for (let i = 0; i < n; i++) {
        const d = mk('circle', { class: 'pkt ' + cls, r, cx: -60, cy: -60 });
        svg.appendChild(d);
        packets.push({ path, el: d, L, dur, start: clock.t + delay + i * gap });
      }
    });
  };
  const move = () => {
    for (let i = packets.length - 1; i >= 0; i--) {
      const p = packets[i], e = clock.t - p.start;
      if (e < 0) continue;
      const u = e / p.dur;
      if (u > 1) { p.el.remove(); packets.splice(i, 1); continue; }
      const q = p.path.getPointAtLength(u * p.L);
      p.el.setAttribute('cx', q.x); p.el.setAttribute('cy', q.y);
    }
  };
  const count = n => { const e = document.querySelector('.cnt'); if (e) e.textContent = n; };

  function run() {
    at(150,  () => on('.t-in'));
    at(500,  () => on('.c1'));
    at(950,  () => on('.c2'));
    at(1400, () => on('.c3'));

    at(2100, () => on('.skill'));
    at(2500, () => { on('.sk'); pkt('.sk', { dur: 600, cls: 'a' }); });
    at(2950, () => on('.mark'));
    at(3550, () => { on('.mark', 'beat'); on('.halo', 'go'); });

    at(3300, () => { on('.i1'); pkt('.i1', { dur: 900 }); });
    at(3600, () => { on('.i2'); pkt('.i2', { dur: 800 }); });
    at(3900, () => { on('.i3'); pkt('.i3', { dur: 900 }); });

    at(4700, () => on('.t-out'));
    at(4900, () => { on('.f1'); pkt('.f1', { dur: 700 }); });
    at(5050, () => { on('.f2'); pkt('.f2', { dur: 700 }); });
    at(5200, () => { on('.f3'); pkt('.f3', { dur: 800 }); });
    at(5300, () => { on('.cnt'); on('.cntl'); count(0); });

    // the machine keeps running while the sheets fill
    for (let t = 5400; t < 18700; t += 620)
      at(t, () => pkt('.fan', { dur: 760, r: 3.6 }));

    ROWS.forEach((r, i) => {
      const t = 5600 + i * 2600;
      at(t,        () => { on(`.${r.k}.rl`); on(`.${r.k}.rm`); });
      at(t + 260,  () => on(`.frame.${r.k}.h1`));
      at(t + 500,  () => { on(`.bar.${r.k}.h1`); on(`.hl.${r.k}`); });
      at(t + 660,  () => { on(`.cta.${r.k}.h1`); count(i * 50 + 1); });
      at(t + 860,  () => on(`.frame.${r.k}.h2`));
      at(t + 1080, () => on(`.bar.${r.k}.h2`));
      at(t + 1240, () => { on(`.cta.${r.k}.h2`); count(i * 50 + 2); });
      // 48 tiles land fast — this is the beat that should feel like volume
      for (let j = 0; j < 48; j++)
        at(t + 1420 + j * 17, () => {
          on(`.mini.${r.k}.m${j}`); on(`.mbar.${r.k}.m${j}`);
          if (j % 4 === 3) count(i * 50 + 2 + j + 1);
        });
      at(t + 2280, () => { count((i + 1) * 50); on(`.mc.${r.k}`); });
    });

    at(12800, () => on('.n1'));
    at(13000, () => on('.n2'));
    at(13200, () => on('.n3'));
    at(13400, () => on('.n4'));
    at(13700, () => on('.rule'));
    at(14000, () => { on('.fx'); on('.repo'); });
    // the finished frame holds for ~5s before the loop restarts — that's the shot to grab
    at(14800, () => { pkt('.i1,.i2,.i3', { dur: 900 }); pkt('.sk', { dur: 700, cls: 'a' }); });
    at(16400, () => { pkt('.i1,.i2,.i3', { dur: 900 }); pkt('.sk', { dur: 700, cls: 'a' }); });
    at(18000, () => { pkt('.i1,.i2,.i3', { dur: 900 }); pkt('.sk', { dur: 700, cls: 'a' }); });
  }

  function restart() {
    packets.forEach(p => p.el.remove()); packets = []; beats = [];
    applied.forEach(([el, c]) => el.classList.remove(c)); applied = [];
    count(0); clock.t = 0; run();
  }

  const bar = document.getElementById('bar'), chrome = document.getElementById('chrome'),
        stateEl = document.getElementById('state');
  let last = performance.now();
  (function frame(now) {
    const dt = Math.min(64, now - last); last = now;
    if (!clock.paused) {
      clock.t += dt;
      for (const b of beats) if (!b.done && clock.t >= b.ms) { b.done = true; b.fn(); }
      bar.style.width = `${Math.min(100, clock.t / DUR * 100)}%`;
      if (clock.t > DUR) restart();
    }
    move();
    requestAnimationFrame(frame);
  })(last);

  addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (e.key === ' ') { clock.paused = !clock.paused;
      stateEl.textContent = (clock.paused ? 'paused' : 'playing') + ' · looping'; e.preventDefault(); }
    else if (k === 'r' || e.key === 'ArrowRight' || e.key === 'ArrowLeft') restart();
    else if (k === 'h') chrome.classList.toggle('hide');
    else if (k === 'f') document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  });
  addEventListener('click', e => { if (!e.target.closest('#chrome')) restart(); });

  run();
})();
</script>
</body>
</html>
