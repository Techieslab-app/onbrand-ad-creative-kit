<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lovable example — a real test run through the kit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF;
  --ink:#18181B;
  --ink2:#71717A;
  --line:#D4D4D8;
  --accent:#BE185D;
  --good:#16A34A;
  --warn:#B45309;
  --frame:#EDEEF0;
  --bar:#9CA3AF;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);overflow:hidden}
body{font-family:"Inter",ui-sans-serif,-apple-system,"Helvetica Neue",Arial,sans-serif;
     color:var(--ink);font-weight:500;-webkit-font-smoothing:antialiased}

#wrap{position:fixed;inset:0;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:1340px;
       transform-origin:center center;transform:translate(-50%,-50%);background:var(--bg)}
svg.d{position:absolute;inset:0;width:1600px;height:1340px;overflow:visible}

.st{fill:var(--ink);font-size:44px;font-weight:400;letter-spacing:-.02em;opacity:0;
    transition:opacity .7s ease}
.st.on{opacity:1}
.sub{fill:var(--ink2);font-size:15px;font-weight:500;opacity:0;transition:opacity .6s ease}
.sub.on{opacity:1}

/* input cards */
.card{opacity:0;transition:opacity .55s ease,transform .55s cubic-bezier(.2,0,.2,1);
      transform:translateX(-16px)}
.card.on{opacity:1;transform:none}
.card rect.box{fill:var(--bg);stroke:var(--line);stroke-width:1.5px}
.card .ct{fill:var(--ink);font-size:16px;font-weight:700;letter-spacing:.05em}
.card .cf{fill:var(--accent);font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;
          font-size:13.5px;font-weight:500}
.card .cl{fill:var(--ink);font-size:14.5px;font-weight:400}
.card .cmk{opacity:0;transition:opacity .5s ease}
.card .cmk.on{opacity:1}

/* wires + packets */
.w{fill:none;stroke:var(--ink2);stroke-width:1.5px;opacity:0;
   transition:opacity .35s ease,stroke-dashoffset .8s cubic-bezier(.4,0,.2,1)}
.w.on{opacity:.8;stroke-dashoffset:0 !important}
.w.fan.on{opacity:.55}
.pkt{fill:var(--ink);filter:drop-shadow(0 1px 4px rgba(24,24,27,.3))}
.pkt.a{fill:var(--accent)}

/* codex mark */
.mark{opacity:0;transform-box:fill-box;transform-origin:center;transform:scale(.86);
      transition:opacity .6s ease,transform .6s cubic-bezier(.2,0,.2,1)}
.mark.on{opacity:1;transform:none}
.mark.beat{animation:beat 2.6s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.halo{fill:none;stroke:#818CF8;stroke-width:1.5px;opacity:0}
.halo.go{animation:halo 2.6s ease-out infinite}
@keyframes halo{0%{opacity:.5;transform:scale(.82)}100%{opacity:0;transform:scale(1.25)}}

/* skill box */
.skill{opacity:0;transition:opacity .55s ease}
.skill.on{opacity:1}
.skill rect{fill:var(--bg);stroke:var(--accent);stroke-width:1.5px;stroke-dasharray:6 5}
.skill .sf{fill:var(--accent);font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;
           font-size:15px;font-weight:500}
.skill .sl{fill:var(--ink2);font-size:13.5px;font-weight:400}

/* output rows */
.rl{fill:var(--ink);font-size:16px;font-weight:700;letter-spacing:.05em;opacity:0;transition:opacity .5s ease}
.rl.on{opacity:1}
.rm{fill:var(--ink2);font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-size:13.5px;
    opacity:0;transition:opacity .5s ease}
.rm.on{opacity:1}
.hl{fill:var(--ink2);font-size:13px;font-weight:600;opacity:0;transition:opacity .5s ease}
.hl.on{opacity:1}
.hid{fill:var(--ink2);font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-size:11px;
     opacity:0;transition:opacity .5s ease}
.hid.on{opacity:1}
.mc{fill:var(--ink2);font-size:13.5px;font-weight:500;opacity:0;transition:opacity .5s ease}
.mc.on{opacity:1}

.shot{opacity:0;transition:opacity .45s ease}
.shot.on{opacity:1}
.shotfr{fill:none;stroke:var(--line);stroke-width:1.5px;opacity:0;transition:opacity .45s ease}
.shotfr.on{opacity:1}

/* counter */
.big{fill:var(--ink);font-size:52px;font-weight:700;letter-spacing:-.03em;opacity:0;
     transition:opacity .4s ease}
.big.on{opacity:1}
.bigl{fill:var(--ink2);font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
      opacity:0;transition:opacity .4s ease}
.bigl.on{opacity:1}

/* footer / notes */
.note{fill:var(--ink);font-size:14.5px;font-weight:400;opacity:0;transition:opacity .6s ease}
.note.on{opacity:1}
.rule{stroke:var(--line);stroke-width:1px;opacity:0;transition:opacity .6s ease}
.rule.on{opacity:.9}
.repo{fill:var(--ink2);font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-size:12.5px;opacity:0;transition:opacity .5s ease}
.repo.on{opacity:.8}

/* QA verdict panel */
.qk{fill:var(--ink2);font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    opacity:0;transition:opacity .5s ease}
.qk.on{opacity:1}
.qtitle{fill:var(--ink);font-size:27px;font-weight:600;letter-spacing:-.015em;opacity:0;
        transition:opacity .6s ease}
.qtitle.on{opacity:1}
.qh{font-size:14px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:0;
    transition:opacity .5s ease}
.qh.on{opacity:1}
.qh.good{fill:var(--good)}
.qh.warn{fill:var(--warn)}
.qi{font-size:14.5px;font-weight:400;opacity:0;transition:opacity .45s ease}
.qi.on{opacity:1}
.qi tspan.g{fill:var(--good);font-weight:700}
.qi tspan.w{fill:var(--warn);font-weight:700}
.qi tspan.b{font-weight:700}
.qline{fill:var(--ink);font-size:15px;font-weight:500;opacity:0;transition:opacity .5s ease}
.qline.on{opacity:1}
.qcmd{fill:var(--ink2);font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-size:13px;
      opacity:0;transition:opacity .5s ease}
.qcmd.on{opacity:1}
.qcmd.ok{fill:var(--good)}

#chrome{position:fixed;left:0;right:0;bottom:0;padding:15px 26px 17px;display:flex;gap:20px;
  align-items:center;font-size:11.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink2);background:linear-gradient(to top,rgba(255,255,255,.95),rgba(255,255,255,0));
  transition:opacity .3s}
#chrome.hide{opacity:0;pointer-events:none}
#keys{margin-left:auto;opacity:.75;font-weight:500;letter-spacing:.05em;text-transform:none;font-size:12px}
#bar{position:fixed;left:0;top:0;height:2px;background:var(--ink);width:0;opacity:.45;transition:width .12s linear}
</style>
</head>

  const DUR = 24500;

  });
  const pkt = (sel, o = {}) => {
    const { dur = 1000, n = 1, gap = 200, r = 4.5, cls = '', delay = 0 } = o;
    document.querySelectorAll(sel).forEach(path => {
      const L = path.getTotalLength() || 1;
      for (let i = 0; i < n; i++) {
        const d = mk('circle', { class: 'pkt ' + cls, r, cx: -60, cy: -60 });
        svg.appendChild(d);
        packets.push({ path, el: d, L, dur, start: clock.t + delay + i * gap });
      }
    });
  };
  const move = () => {
    for (let i = packets.length - 1; i >= 0; i--) {
      const p = packets[i], e = clock.t - p.start;
      if (e < 0) continue;
      const u = e / p.dur;
      if (u > 1) { p.el.remove(); packets.splice(i, 1); continue; }

    at(16900, () => on('.qh2'));
    [6, 7, 8, 9, 10].forEach(i => at(17200 + (i - 6) * 300, () => on(`.qi${i}`)));
    at(19000, () => on('.qline1'));
    at(19700, () => on('.qline2'));
    at(20500, () => on('.rule2'));
    at(20800, () => on('.qcmd1'));
    at(21200, () => on('.qcmd2'));

    // the finished frame holds for a few seconds before the loop restarts
    at(22200, () => { pkt('.i1,.i2,.i3', { dur: 900 }); pkt('.sk', { dur: 700, cls: 'a' }); });
    at(23600, () => pkt('.fan', { dur: 700, n: 2, gap: 160 }));
  }

  function restart() {
    packets.forEach(p => p.el.remove()); packets = []; beats = [];
    applied.forEach(([el, c]) => el.classList.remove(c)); applied = [];
    count(0); clock.t = 0; run();
  }

  const bar = document.getElementById('bar'), chrome = document.getElementById('chrome'),
        stateEl = document.getElementById('state');
  let last = performance.now();
  (function frame(now) {
    const dt = Math.min(64, now - last); last = now;
    if (!clock.paused) {
      clock.t += dt;
      for (const b of beats) if (!b.done && clock.t >= b.ms) { b.done = true; b.fn(); }
      bar.style.width = `${Math.min(100, clock.t / DUR * 100)}%`;
      if (clock.t > DUR) restart();
    }
    move();
    requestAnimationFrame(frame);
  })(last);

  addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (e.key === ' ') { clock.paused = !clock.paused;
      stateEl.textContent = (clock.paused ? 'paused' : 'playing') + ' · looping'; e.preventDefault(); }
    else if (k === 'r' || e.key === 'ArrowRight' || e.key === 'ArrowLeft') restart();
    else if (k === 'h') chrome.classList.toggle('hide');
    else if (k === 'f') document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  });
  addEventListener('click', e => { if (!e.target.closest('#chrome')) restart(); });

  run();
})();
</script>
</body>
</html>
